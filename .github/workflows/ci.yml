name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain version is single-sourced from go.mod, so it never drifts from the code.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every check runs through the Makefile so CI and local `make` stay identical.
      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
